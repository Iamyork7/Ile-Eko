<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a5276">
    <title>Data and Information | Ile-Eko</title>
    <style>
        :root {
            --primary: #1a5276;
            --secondary: #2874a6;
            --accent: #f39c12;
            --light: #f8f9fa;
            --dark: #2c3e50;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--dark);
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        }
        .icon { font-size: 4rem; margin-bottom: 16px; }
        h1 { font-size: 1.4rem; color: var(--primary); margin-bottom: 10px; }
        p { color: #6c757d; font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px; }
        .badge {
            display: inline-block;
            background: #fff3cd;
            color: #856404;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(26,82,118,0.3); }
        .tree { margin-top: 20px; font-size: 0.8rem; color: #adb5bd; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📊</div>
        <div class="badge">⏳ COMING SOON</div>
        <h1>Topic 3: Data and Information</h1>
        <p>Understand the difference between raw data and processed information. Sorting simulations coming soon!</p>
        <a href="../../index.html" class="btn">← Back to Computer Studies</a>
        <div class="tree">Ile-Eko Offline Library</div>
    </div>
</body>
</html>
